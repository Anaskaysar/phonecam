# Local test copy of the PhoneCam Worker, used by tests/e2e/run.mjs.
name = "phonecam-test"
main = "../../worker/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "../../.test-build/site"
binding = "ASSETS"
# Same as production: /webcam serves webcam/index.html.
html_handling = "drop-trailing-slash"
not_found_handling = "none"

[[durable_objects.bindings]]
name = "SIGNAL"
class_name = "SignalRoom"

[[durable_objects.bindings]]
name = "VISITS"
class_name = "VisitCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["VisitCounter"]

[[d1_databases]]
binding = "DB"
database_name = "phonecam"
database_id = "00000000-0000-0000-0000-000000000000"
