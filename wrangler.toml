name = "phonecam"
main = "worker/index.js"
compatibility_date = "2024-09-23"
workers_dev = true

routes = [
  { pattern = "phonecam.app", custom_domain = true },
  { pattern = "www.phonecam.app", custom_domain = true }
]

# The site uses #/ links, so every page is index.html or a real file.
# Requests for files that don't exist go to worker/index.js (signalling and /api).
[assets]
directory = "./dist"
binding = "ASSETS"
# /webcam serves the built webcam/index.html, and /webcam/ redirects to /webcam.
html_handling = "drop-trailing-slash"
not_found_handling = "none"

# Signalling server: one Durable Object per room (free plan uses SQLite-backed objects).
[[durable_objects.bindings]]
name = "SIGNAL"
class_name = "SignalRoom"

[[durable_objects.bindings]]
name = "VISITS"
class_name = "VisitCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["VisitCounter"]

# TURN relay (optional). Create a TURN key in the Cloudflare dashboard
# (Realtime > TURN Server), then:
#   npx wrangler secret put TURN_KEY_ID
#   npx wrangler secret put TURN_KEY_API_TOKEN

# Ratings database (Cloudflare D1, free). To turn ratings on:
#   1. npx wrangler d1 create phonecam
#   2. paste the database_id it prints below and remove the # signs
# The Worker creates the table itself on first use. Moderate with admin-local/ (local only).
# Until then the site simply hides the ratings section.
[[d1_databases]]
binding = "DB"
database_name = "phonecam"
database_id = "a33ee483-2a24-4467-80b0-e0d9c744e510"

# Problem reports (the "Report an issue" form at /#/report). Free with Cloudflare Email Routing.
#   1. Cloudflare dashboard → phonecam.app → Email → Email Routing → Enable (it adds the MX records)
#   2. Destination addresses → add kaysarulanas2@gmail.com and click the link in the email Cloudflare sends
#   3. Routing rules → Custom address hello@phonecam.app → Send to kaysarulanas2@gmail.com
#   4. Remove the # signs below, then npm run deploy
# Until then the form says it can't send and shows hello@phonecam.app instead.
