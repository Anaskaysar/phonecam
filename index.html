<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="description" content="Skip the new webcam. Use the phone you already have, on a stand of about $3, as the camera in Zoom, Meet, Teams and OBS. Free, and no app on the phone." />
  <link rel="canonical" href="https://phonecam.app/" />
  <meta property="og:title" content="PhoneCam · Your phone is the webcam" />
  <meta property="og:description" content="Why buy a webcam? Use your phone and a cheap stand. The picture goes straight to your laptop." />
  <meta property="og:url" content="https://phonecam.app/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PhoneCam" />
  <meta property="og:image" content="https://phonecam.app/icons/icon-512.png" />
  <meta name="twitter:card" content="summary" />
  <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PhoneCam" />
  <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
  <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-180.png" />
  <title>PhoneCam · Your phone is the webcam</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "PhoneCam",
    "applicationCategory": "MultimediaApplication",
    "operatingSystem": "Web",
    "url": "https://phonecam.app/",
    "description": "Use the phone you already own as a webcam on a laptop for Zoom, Meet, Teams and OBS. No app on the phone.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>
  <script>
    (function () {
      var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone
      if (standalone) document.documentElement.classList.add('standalone')
      var hash = location.hash
      if (standalone && (!hash || hash === '#' || hash === '#/')) location.replace('#/camera')
      var themes = { sky: ['#7cc4ff', '#04213b'], coral: ['#ff8f6e', '#2b0c03'], violet: ['#b8a3ff', '#170b38'], mint: ['#6fe3b4', '#03261a'] }
      try {
        var picked = themes[localStorage.getItem('pc.theme')]
        if (picked) {
          document.documentElement.style.setProperty('--accent', picked[0])
          document.documentElement.style.setProperty('--accent-ink', picked[1])
        }
      } catch (e) {}
    })()
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>PhoneCam needs JavaScript to reach your camera.</noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
